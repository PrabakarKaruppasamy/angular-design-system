@if (visible()) {
  <div [class]="positionClasses" role="alert" aria-live="assertive">
    <div [class]="panelClasses">

      <!-- Icon -->
      <svg
        class="w-5 h-5 shrink-0 mt-0.5"
        [class]="iconColorClass"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          [attr.d]="iconPath"/>
      </svg>

      <!-- Content -->
      <div class="flex-1 min-w-0">
        @if (title()) {
          <p class="text-sm font-semibold">{{ title() }}</p>
        }
        @if (message()) {
          <p class="text-sm mt-0.5 opacity-90">{{ message() }}</p>
        }
      </div>

      <!-- Close button -->
      @if (dismissible()) {
        <button
          (click)="dismiss()"
          (keydown.enter)="dismiss()"
          (keydown.space)="dismiss()"
          class="shrink-0 p-0.5 rounded opacity-60 hover:opacity-100 transition-opacity"
          aria-label="Dismiss notification"
          type="button">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      }

    </div>
  </div>
}
