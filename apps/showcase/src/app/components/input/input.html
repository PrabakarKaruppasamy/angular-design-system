<div [class]="wrapperClasses">
  @if (label()) {
    <label
      [for]="id()"
      class="text-sm font-medium text-gray-700">
      {{ label() }}
    </label>
  }

  <input
    [id]="id()"
    [type]="type()"
    [class]="inputClasses"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value"
    (input)="handleInput($event)"
    (blur)="onTouched()"
  />

  @if (error()) {
    <span class="text-xs text-red-500" role="alert">{{ error() }}</span>
  } @else if (hint()) {
    <span class="text-xs text-gray-400">{{ hint() }}</span>
  }
</div>
