@if (open()) {
  <div
    [class]="backdropClasses"
    (click)="onBackdropClick($event)"
    (keydown.escape)="close()"
    (keydown.enter)="onBackdropClick($event)"
    tabindex="0"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()">

    <div [class]="panelClasses">

      <!-- Header -->
      <div class="flex items-start justify-between px-6 pt-6 pb-4 border-b border-gray-100">
        <div>
          @if (title()) {
            <h2 class="text-base font-semibold text-gray-900">{{ title() }}</h2>
          }
          @if (subtitle()) {
            <p class="text-sm text-gray-500 mt-0.5">{{ subtitle() }}</p>
          }
        </div>

        @if (showClose()) {
          <button
            (click)="close()"
            (keydown.enter)="close()"
            (keydown.space)="close()"
            class="ml-4 p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors"
            aria-label="Close modal"
            type="button">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        }
      </div>

      <!-- Body -->
      <div class="px-6 py-4 overflow-y-auto flex-1">
        <ng-content></ng-content>
      </div>

      <!-- Footer -->
      <div class="px-6 pb-6 pt-4 border-t border-gray-100">
        <ng-content select="[slot=footer]"></ng-content>
      </div>

    </div>
  </div>
}
